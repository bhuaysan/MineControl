packages:
  - "apps/*"
  - "packages/*"

# Diese Pakete dürfen Post-Install-Build-Skripte ausführen (native Module / Codegen).
allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  argon2: true
  # dockerode nutzt den Unix-Socket; SSH-Transport (ssh2/cpu-features) ungenutzt.
  cpu-features: false
  esbuild: true
  prisma: true
  protobufjs: false
  ssh2: false
