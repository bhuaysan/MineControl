name: Release

# Baut die Produktiv-Images und published sie nach GHCR.
# Läuft NICHT bei jedem Push/PR (das macht ci.yml), sondern nur auf main
# und bei Versions-Tags. Images sind multi-arch (amd64 + arm64).
on:
  push:
    branches: [main]
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  # Dieselben Prüfungen wie ci.yml (typecheck/lint/test/build), auf demselben
  # Commit — als Gate vor dem Image-Push. Ohne dieses `needs:` liefe dieser
  # Workflow unabhängig von ci.yml und würde `latest` auch dann publishen,
  # wenn CI für denselben Push fehlschlägt.
  verify:
    name: Verify (CI)
    uses: ./.github/workflows/ci.yml

  images:
    name: Build & push (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          # Backend (Fastify) — Dockerfile-Stufe `runtime`.
          - name: app
            target: runtime
          # Caddy + gebaute SPA — Dockerfile-Stufe `web`.
          - name: web
            target: web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Emulation für arm64 (native Module argon2/prisma werden pro Arch gebaut).
      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/minecontrol-${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Getrennte Cache-Scopes pro Image, sonst überschreiben sie sich.
          cache-from: type=gha,scope=${{ matrix.name }}
          # ignore-error: der GHA-Cache-Export ist reine Build-Beschleunigung,
          # kein Korrektheitsmerkmal — Image wird davor bereits gepusht. Ohne
          # dieses Flag lässt ein bekanntes BuildKit/GHA-Cache-Flake ("error
          # writing layer blob: not_found") den ganzen Job fehlschlagen, obwohl
          # das Image längst erfolgreich in der Registry liegt.
          cache-to: type=gha,mode=max,scope=${{ matrix.name }},ignore-error=true
